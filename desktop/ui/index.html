<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCodex</title>
    <style>
      :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #f5f5f7; color: #202124; }
      main { width: min(38rem, calc(100vw - 3rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 8px 30px #0001; }
      h1 { margin-top: 0; font-size: 1.4rem; }
      #headline { margin: 0 0 .25rem; font-weight: 600; }
      #detail { margin: 0; min-height: 1.4rem; color: #666; font-size: .9rem; }
      #phases { margin: 1.25rem 0 0; padding: 0; list-style: none; display: grid; gap: .4rem; }
      #phases li { display: flex; gap: .6rem; align-items: baseline; color: #8a8a8e; }
      #phases li .mark { width: 1rem; text-align: center; }
      #phases li[data-state="active"] { color: #202124; font-weight: 600; }
      #phases li[data-state="done"] { color: #4b8b3b; }
      #phases li[data-state="failed"] { color: #b3261e; font-weight: 600; }
      #failure { margin-top: 1.25rem; display: grid; gap: .75rem; }
      #failure[hidden], #consent[hidden] { display: none; }
      #consent { margin-top: 1.25rem; display: grid; gap: .75rem; }
      #consent p { margin: 0; }
      #consentTarget { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .75rem; margin: 0; }
      #consentTarget dt { color: #666; }
      #consentTarget dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
      #consentNote { color: #666; font-size: .85rem; }
      .actions { display: flex; gap: .6rem; align-items: center; }
      button { border: 0; border-radius: .5rem; padding: .6rem 1rem; background: #2563eb; color: white; cursor: pointer; font: inherit; }
      button.secondary { background: #e3e3e8; color: #202124; }
      button[disabled] { opacity: .5; cursor: default; }
      #copyState { color: #666; font-size: .85rem; }
      textarea { width: 100%; box-sizing: border-box; min-height: 9rem; resize: vertical; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: .5rem; border: 1px solid #0002; padding: .6rem; background: #fafafa; color: inherit; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1e; color: #f5f5f7; }
        main { background: #2c2c2e; }
        #detail, #copyState { color: #bbb; }
        #phases li[data-state="active"] { color: #f5f5f7; }
        #phases li[data-state="done"] { color: #8bd17c; }
        #phases li[data-state="failed"] { color: #ff8a80; }
        #consentTarget dt, #consentNote { color: #bbb; }
        button.secondary { background: #3a3a3c; color: #f5f5f7; }
        textarea { background: #1c1c1e; border-color: #ffffff22; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenCodex</h1>
      <p id="headline">Starting OpenCodex…</p>
      <p id="detail"></p>
      <ol id="phases"></ol>
      <div id="consent" hidden>
        <p id="consentLead">A runtime is already listening. Take it over?</p>
        <dl id="consentTarget">
          <dt>Port</dt><dd id="consentPort"></dd>
          <dt>Configuration home</dt><dd id="consentHome"></dd>
          <dt>Current owner</dt><dd id="consentOwner"></dd>
        </dl>
        <p id="consentNote">Taking over stops that runtime, starts the runtime bundled with this app, and records this app as the owner so the CLI no longer starts a runtime beside it.</p>
        <div class="actions">
          <button id="takeOver" type="button">Take over</button>
          <button id="stayGuest" class="secondary" type="button">Stay a guest</button>
        </div>
      </div>
      <div id="failure" hidden>
        <div class="actions">
          <button id="retry" type="button">Retry</button>
          <button id="copy" class="secondary" type="button">Copy diagnostic</button>
          <span id="copyState"></span>
        </div>
        <textarea id="diagnostic" readonly spellcheck="false"></textarea>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
